[package]
name = "takeout-helper-gphotos"
version = "0.1.1"
authors = ["Shaun Murphy"]
edition = "2024"
rust-version = "1.88"
description = "Organize Google Photos Takeout archives into a clean, metadata-corrected, chronologically sorted photo library"
license = "Apache-2.0"
repository = "https://github.com/shoon/takeout-helper-gphotos"
homepage = "https://github.com/shoon/takeout-helper-gphotos"
readme = "README.md"
keywords = ["google-photos", "takeout", "exif", "photos", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
publish = false

[workspace]
members = ["."]
exclude = ["vendor/little_exif"]
resolver = "3"

[[bin]]
name = "takeout-helper-gphotos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
zip = "8.6.0"
tar = "0.4.46"
flate2 = "1.1.10"
walkdir = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
chrono-tz = "0.10.4"
tzf-rs = "1.3.7"
indicatif = "0.18.6"
env_logger = "0.11.11"
little_exif = { path = "vendor/little_exif" }
log = "0.4.34"
ctrlc = "3.5.2"
rand = "0.10.2"
fs2 = "0.4.3"
rayon = "1.12.0"
thiserror = "2.0.20"
filetime = "0.2.29"
blake3 = "1.8.7"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
