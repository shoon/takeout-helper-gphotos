changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels:
        - security
    - title: Fixed
      labels:
        - bug
    - title: Added and changed
      labels:
        - enhancement
        - feature
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
